name: Update README

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v3

      - name: Fetch activity data
        run: |
          curl -o auto.json https://raw.githubusercontent.com/Flevian11/flevian-activity/main/auto.json

      - name: Update README timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          sed -i "s|Last Updated:.*|Last Updated: $TIMESTAMP|" README.md || echo "No timestamp line yet"

      - name: Commit changes
        run: |
          git config user.name "Flevian11"
          git config user.email "flevianochoka19@gmail.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto: update README"
            git push
          fi