name: Update GitHub Stats

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats-main
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm init -y
          npm install axios moment

      - name: Generate stats.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          cat > fetch_stats.js << 'EOF'
          const axios = require("axios");
          const moment = require("moment");
          const fs = require("fs");

          const username = "Flevian11";
          const token = process.env.GITHUB_TOKEN;

          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json"
          };

          async function getAllRepos() {
            const repos = [];

            for (let page = 1; page <= 10; page++) {
              const response = await axios.get(
                `https://api.github.com/users/${username}/repos`,
                {
                  headers,
                  params: {
                    per_page: 100,
                    page,
                    type: "owner",
                    sort: "updated"
                  }
                }
              );

              repos.push(...response.data);

              if (response.data.length < 100) {
                break;
              }
            }

            return repos;
          }

          async function getContributionData() {
            try {
              const response = await axios.get(
                `https://github-contributions-api.jogruber.de/v4/${username}`
              );

              return response.data.contributions || [];
            } catch (error) {
              console.log("Contribution API unavailable.");
              return [];
            }
          }

          function calculateStreaks(weeks) {
            const days = (weeks || []).flatMap(
              week => Array.isArray(week.days) ? week.days : []
            );

            if (!days.length) {
              return {
                currentStreak: 0,
                longestStreak: 0,
                totalContributions: 0
              };
            }

            let totalContributions = 0;
            let longestStreak = 0;
            let currentRun = 0;

            for (const day of days) {
              const count = Number(day.count || 0);

              totalContributions += count;

              if (count > 0) {
                currentRun++;
                longestStreak = Math.max(longestStreak, currentRun);
              } else {
                currentRun = 0;
              }
            }

            let currentStreak = 0;

            for (let i = days.length - 1; i >= 0; i--) {
              if (Number(days[i].count || 0) > 0) {
                currentStreak++;
              } else {
                break;
              }
            }

            return {
              currentStreak,
              longestStreak,
              totalContributions
            };
          }

          async function main() {
            const userResponse = await axios.get(
              `https://api.github.com/users/${username}`,
              { headers }
            );

            const user = userResponse.data;
            const repos = await getAllRepos();

            const totalStars = repos.reduce(
              (sum, repo) => sum + Number(repo.stargazers_count || 0),
              0
            );

            const totalForks = repos.reduce(
              (sum, repo) => sum + Number(repo.forks_count || 0),
              0
            );

            const topRepos = [...repos]
              .sort((a, b) => {
                if (b.stargazers_count !== a.stargazers_count) {
                  return b.stargazers_count - a.stargazers_count;
                }

                return b.forks_count - a.forks_count;
              })
              .slice(0, 5)
              .map(repo => ({
                name: repo.name,
                stars: repo.stargazers_count,
                forks: repo.forks_count,
                description: repo.description || "No description",
                url: repo.html_url
              }));

            let recentActivity = [];

            try {
              const eventsResponse = await axios.get(
                `https://api.github.com/users/${username}/events/public`,
                {
                  headers,
                  params: {
                    per_page: 10
                  }
                }
              );

              recentActivity = eventsResponse.data.map(event => {
                let action;

                switch (event.type) {
                  case "PushEvent":
                    action = "📝 Pushed to";
                    break;
                  case "CreateEvent":
                    action = "✨ Created";
                    break;
                  case "WatchEvent":
                    action = "⭐ Starred";
                    break;
                  case "ForkEvent":
                    action = "🔱 Forked";
                    break;
                  default:
                    action = `🔄 ${event.type.replace("Event", "")}`;
                }

                return {
                  action,
                  repo: event.repo.name,
                  date: moment(event.created_at).fromNow()
                };
              });
            } catch {
              recentActivity = [];
            }

            const contributionWeeks = await getContributionData();
            const streakData = calculateStreaks(contributionWeeks);

            const score = Math.min(
              100,
              Math.floor(
                user.followers * 0.3 +
                totalStars * 0.4 +
                user.public_repos * 0.3
              )
            );

            const stats = {
              generated_at: new Date().toISOString(),
              username,
              streak: streakData.currentStreak,
              longest_streak: streakData.longestStreak,
              stars: totalStars,
              forks: totalForks,
              repos: user.public_repos,
              followers: user.followers,
              contributions: streakData.totalContributions,
              score,
              top_repos: topRepos,
              recent_activity: recentActivity
            };

            fs.writeFileSync(
              "stats.json",
              JSON.stringify(stats, null, 2) + "\n"
            );

            console.log("stats.json generated successfully.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node fetch_stats.js

      - name: Validate stats
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('stats.json', 'utf8'));

          const required = [
            'streak',
            'longest_streak',
            'stars',
            'forks',
            'repos',
            'followers',
            'contributions',
            'score',
            'top_repos',
            'recent_activity'
          ];

          for (const key of required) {
            if (!(key in data)) {
              throw new Error('Missing stats field: ' + key);
            }
          }

          console.log('stats.json validation passed.');
          "

      - name: Commit stats
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Flevian11"
          git config user.email "flevianochoka19@gmail.com"

          git add stats.json

          if git diff --cached --quiet; then
            echo "No stats changes."
            exit 0
          fi

          git commit -m "chore: update GitHub stats"
          git push